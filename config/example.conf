# smb-logs / logview project config — copy to ~/.config/smb-logs/<project>.conf and fill in.
# One line per environment, fields separated by spaces (# = comment):
#   <env>   <//server/share>          <folder on the share>        <file name pattern, {date} = YYYY-MM-DD>
#
# Example (made-up values):
stg     //10.0.0.10/logs-uat          myteam/uat-myapp             app.{date}.1.log
prod    //10.0.0.20/logs-prod         myteam/prod-myapp            app.{date}.1.log
